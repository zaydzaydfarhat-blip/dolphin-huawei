name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "docs/**"
      - "patches/**"
      - "README.md"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dolphin-Huawei Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out project and both source trees
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify pinned upstream revisions
        run: |
          test "$(git -C Source rev-parse HEAD)" = "19018c423998eea431c2c435903b3c97597d0768"
          test "$(git -C upstream/MMJR2-VBI rev-parse HEAD)" = "396014bc1712a001597d25ee849a5253fc170180"
          git -C Source submodule update --init --recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;30.0.15729638" \
            "cmake;3.25.0"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        working-directory: Source/Source/Android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        run: |
          find Source/Source/Android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-huawei-android-debug
          path: Source/Source/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
